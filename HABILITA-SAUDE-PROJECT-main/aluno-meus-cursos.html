<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meus Cursos - Área do Aluno</title>

    <link rel="stylesheet" href="./css/aluno.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div id="overlay"></div>

    <div class="container">
      <aside class="sidebar">
        <div>
          <div class="logo-side">
            <h2>HABILITA.SAÚDE</h2>
            <p>Área do Aluno</p>
          </div>

          <ul>
            <li>
              <a href="./aluno-inicio.html">
                <i class="fa-solid fa-house"></i>
                Início
              </a>
            </li>

            <li>
              <a href="./aluno-meus-cursos.html" class="menu-ativo">
                <i class="fa-solid fa-book"></i>
                Meus Cursos
              </a>
            </li>

            <li>
              <a href="./aluno-suporte.html">
                <i class="fa-regular fa-circle-question"></i>
                Suporte
              </a>
            </li>
          </ul>
        </div>

        <div>
          <div class="perfil">
            <div class="foto-wrapper">
              <img
                id="fotoUsuarioSidebar"
                src="https://ui-avatars.com/api/?name=Aluno&background=163b97&color=fff"
                alt="Foto do aluno"
              />
              <span class="online"></span>
            </div>
            <span id="nomeUsuarioSidebar"></span>
          </div>

          <div class="logout-container">
            <button id="btnLogout">Sair</button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuMobile" class="menu-mobile">☰</button>

          <div>
            <h1>MEUS CURSOS</h1>
            <p>Acompanhe seu progresso em todos os cursos</p>
          </div>

          <div class="icons">
            <a href="aluno-suporte.html">
              <i class="fa-regular fa-circle-question"></i>
            </a>

            <a href="#" class="notification">
              <i class="fa-regular fa-bell"></i>
              <span id="badgeNotificacao"></span>
            </a>

            <div class="user-top">
              <div class="foto-wrapper">
                <img
                  id="fotoUsuarioTop"
                  src="https://ui-avatars.com/api/?name=Aluno&background=163b97&color=fff"
                  alt="Foto do aluno"
                />
                <span class="online"></span>
              </div>
              <span id="nomeUsuarioTop"></span>
            </div>
          </div>
        </header>

        <!-- Abas por status -->
        <section class="abas-cursos">
          <button class="aba ativa" data-status="todos">
            Todos <span class="contador" id="contTodos">0</span>
          </button>

          <button class="aba" data-status="andamento">
            Em andamento <span class="contador" id="contAndamento">0</span>
          </button>

          <button class="aba" data-status="concluido">
            Concluídos <span class="contador" id="contConcluido">0</span>
          </button>

          <button class="aba" data-status="nao-iniciado">
            Não iniciados <span class="contador" id="contNaoIniciado">0</span>
          </button>
        </section>

        <!-- Busca e filtros -->
        <section class="filtros-cursos">
          <div class="busca">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="campoBusca"
              placeholder="Buscar em meus cursos..."
            />
          </div>

          <select id="filtroArea">
            <option value="">Todas as áreas</option>
          </select>

          <select id="filtroCategoria">
            <option value="">Todas as categorias</option>
          </select>

          <select id="filtroOrdenacao">
            <option value="recentes">Acessados recentemente</option>
            <option value="progresso">Maior progresso</option>
            <option value="matricula">Matrícula mais recente</option>
            <option value="nome">Nome (A-Z)</option>
          </select>
        </section>

        <!-- Lista de cursos -->
        <section id="listaCursos" class="lista-cursos"></section>
      </main>
    </div>

    <script src="./js/user.js"></script>
    <script src="./js/global.js"></script>
    <script src="./js/aluno-dados.js"></script>
    <script src="./js/aluno-meus-cursos.js"></script>
  </body>
</html>
