<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meus cursos — Habilita Saúde</title>

    <link rel="stylesheet" href="./css/aluno.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/animacoes.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./css/habilita.css" />
  </head>

  <body class="app-shell">
    <div id="overlay"></div>

    <div class="container">
      <aside class="sidebar" aria-label="Navegação principal">
        <div>
          <div class="logo-side">
            <a href="./aluno-inicio.html" aria-label="Habilita Saúde — Início">
              <img class="logo-h" src="./img/logo-habilita.png" alt="Habilita Saúde" />
            </a>
          </div>
          <nav>
            <ul>
            <li>
              <a href="./aluno-inicio.html">
                <i class="fa-solid fa-house"></i>
                Início
              </a>
            </li>
            <li>
              <a href="./aluno-meus-cursos.html" class="menu-ativo" aria-current="page">
                <i class="fa-solid fa-book"></i>
                Meus cursos
              </a>
            </li>
            <li>
              <a href="./certificados.html">
                <i class="fa-solid fa-award"></i>
                Certificados
              </a>
            </li>
            <li>
              <a href="./aluno-suporte.html">
                <i class="fa-solid fa-circle-question"></i>
                Suporte
              </a>
            </li>
            </ul>
          </nav>
        </div>

        <div class="logout-container">
          <button type="button" id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Sair
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuMobile" class="menu-mobile" type="button" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
          </button>

          <nav class="breadcrumb" aria-label="Você está em">
          <a href="./aluno-inicio.html">Início</a>
          <span class="sep">/</span>
          <span class="atual" aria-current="page">Meus cursos</span>
          </nav>

          <div class="icons">
            <span class="perfil-tag">Aluno</span>
            <a href="./aluno-suporte.html" class="link-suporte" aria-label="Suporte">
              <i class="fa-regular fa-circle-question"></i>
            </a>
            <a href="./notificacoes.html" class="notification" aria-label="Notificações">
              <i class="fa-regular fa-bell"></i>
              <span id="badgeNotificacao"></span>
            </a>
            <a href="./perfil.html" class="user-top" aria-label="Meu perfil">
              <img id="fotoUsuarioTop" src="https://ui-avatars.com/api/?name=U&background=0055c3&color=fff" alt="" />
              <span id="nomeUsuarioTop"></span>
            </a>
          </div>
        </header>

        <div class="content">
        <div class="page-header">
          <div class="page-title">
            <h1>Meus cursos</h1>
            <p>Acompanhe seu progresso em todos os cursos.</p>
          </div>
        </div>


        <section class="abas-cursos">
          <button class="aba ativa" data-status="todos">
            Todos <span class="contador" id="contTodos">0</span>
          </button>

          <button class="aba" data-status="andamento">
            Em andamento <span class="contador" id="contAndamento">0</span>
          </button>

          <button class="aba" data-status="concluido">
            Concluídos <span class="contador" id="contConcluido">0</span>
          </button>

          <button class="aba" data-status="nao-iniciado">
            Não iniciados <span class="contador" id="contNaoIniciado">0</span>
          </button>
        </section>

        <section class="filtros-cursos">
          <div class="busca">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="campoBusca"
              placeholder="Buscar em meus cursos..."
            />
          </div>

          <select id="filtroArea">
            <option value="">Todas as áreas</option>
          </select>

          <select id="filtroCategoria">
            <option value="">Todas as categorias</option>
          </select>

          <select id="filtroOrdenacao">
            <option value="recentes">Acessados recentemente</option>
            <option value="progresso">Maior progresso</option>
            <option value="matricula">Matrícula mais recente</option>
            <option value="nome">Nome (A-Z)</option>
          </select>
        </section>

        <section id="listaCursos" class="lista-cursos"></section>
      </div>
      </main>
    </div>

    <script src="./js/user.js"></script>
    <script src="./js/conteudos-demo.js"></script>
    <script src="./js/global.js"></script>
    <script src="./js/gamificacao.js"></script>
    <script src="./js/aluno-dados.js"></script>
    <script src="./js/aluno-meus-cursos.js"></script>
    <script src="./js/animacoes.js"></script>
  </body>
</html>
