<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecionando — Habilita Saúde</title>
    <meta name="description" content="Acesse o painel da Habilita Saúde." />
    <script>
      (function () {
        var destino = "professor-inicio.html";
        try {
          var logado = localStorage.getItem("usuarioLogado") === "true";
          var usuario = JSON.parse(localStorage.getItem("usuario") || "null");
          if (logado && usuario && usuario.tipo === "aluno") destino = "aluno-inicio.html";
        } catch (e) {}
        window.location.replace(destino);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=professor-inicio.html" /></noscript>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f7f9fa;
        color: #1a202c;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      a { color: #0055c3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirecionando…</h1>
      <p>Se nada acontecer, <a href="./professor-inicio.html">continue para o painel</a>.</p>
    </main>
  </body>
</html>
