<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meu perfil — Habilita Saúde</title>
    <meta name="description" content="Gerencie seus dados pessoais, foto e preferências de perfil na Habilita Saúde." />

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/animacoes.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./css/habilita.css" />
    <link rel="stylesheet" href="./css/dark.css" />
    <script src="./js/tema.js"></script>
  </head>

  <body class="app-shell">
    
    <div id="overlay"></div>
    <div class="container">
      <aside class="sidebar" aria-label="Navegação principal">
        <div>
          <div class="logo-side">
            <a href="./aluno-inicio.html" aria-label="Habilita Saúde — Início">
              <img class="logo-h" src="./img/logo-habilita.png" alt="Habilita Saúde" />
            </a>
          </div>
          <nav>
            <ul>
            <li>
              <a href="./aluno-inicio.html">
                <i class="fa-solid fa-house"></i>
                Início
              </a>
            </li>
            <li>
              <a href="./aluno-meus-cursos.html">
                <i class="fa-solid fa-book"></i>
                Meus cursos
              </a>
            </li>
            <li>
              <a href="./certificados.html">
                <i class="fa-solid fa-award"></i>
                Certificados
              </a>
            </li>
            <li>
              <a href="./aluno-suporte.html">
                <i class="fa-solid fa-circle-question"></i>
                Suporte
              </a>
            </li>
            </ul>
          </nav>
        </div>

        <div class="logout-container">
          <button type="button" id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Sair
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuMobile" class="menu-mobile" type="button" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
          </button>

          <nav class="breadcrumb" aria-label="Você está em">
          <a href="./aluno-inicio.html">Início</a>
          <span class="sep">/</span>
          <span class="atual" aria-current="page">Meu perfil</span>
          </nav>

          <div class="icons">
            <span class="perfil-tag">Aluno</span>
            <a href="./aluno-suporte.html" class="link-suporte" aria-label="Suporte">
              <i class="fa-regular fa-circle-question"></i>
            </a>
            <a href="./notificacoes.html" class="notification" aria-label="Notificações">
              <i class="fa-regular fa-bell"></i>
              <span id="badgeNotificacao"></span>
            </a>
            <a href="./perfil.html" class="user-top" aria-label="Meu perfil">
              <img id="fotoUsuarioTop" src="./img/perfil.svg" alt="" />
              <span id="nomeUsuarioTop"></span>
            </a>
          </div>
        </header>

        <div class="content">
        <div class="page-header">
          <div class="page-title">
            <h1>Meu perfil</h1>
            <p>Atualize seu nome, e-mail e foto.</p>
          </div>
        </div>


        <section class="perfil-card">
          <img
            id="previewFoto"
            src="./img/perfil.svg"
            alt="Foto do usuário"
            class="foto-perfil-grande"
          />
          <h2>Dados pessoais</h2>

          <input type="text" id="nomeUsuario" placeholder="Nome" />

          <input type="email" id="emailUsuario" placeholder="E-mail" />

          <label for="novaFoto" class="label-foto"> Foto de perfil </label>

          <input type="file" id="novaFoto" accept="image/*" />

          <small class="texto-foto">
            Escolha uma imagem para ser sua foto de perfil.
          </small>
          <button id="salvarPerfil">Salvar alterações</button>
        </section>
        <section id="listaNotificacoes"></section>
      </div>
      </main>
    </div>

    <script src="./js/user.js"></script>
    <script src="./js/perfil.js"></script>
    <script src="./js/global.js"></script>
    <script src="./js/animacoes.js"></script>
  </body>
</html>
