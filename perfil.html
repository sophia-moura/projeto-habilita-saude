<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perfil</title>

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <aside class="sidebar">
        <div>
          <div class="logo-side">
            <h2>HABILITA.SAÚDE</h2>
            <p>Plataforma De Cursos em Saúde</p>
          </div>

          <ul>
            <li>
              <a href="./dashboard.html">
                <i class="fa-solid fa-house"></i>
                Início
              </a>
            </li>

            <ul>
  <li>
    <a href="./aluno-inicio.html">
      <i class="fa-solid fa-house"></i>
      Início
    </a>
  </li>

  <li>
    <a href="./aluno-meus-cursos.html">
      <i class="fa-solid fa-book"></i>
      Meus Cursos
    </a>
  </li>

  <li>
    <a href="./aluno-suporte.html">
      <i class="fa-regular fa-circle-question"></i>
      Suporte
    </a>
  </li>
</ul>
        </div>

        <div class="perfil">
          <div class="foto-wrapper">
            <a href="./perfil.html">
              <img id="fotoUsuarioSidebar" src="./img/perfil.jpg" />
            </a>

            <span class="online"></span>
          </div>

          <span id="nomeUsuarioSidebar"></span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuMobile" class="menu-mobile">☰</button>
          <div>
            <h1>ALUNO(A)</h1>
            <p>Bem-vindo(a) ao seu painel</p>
          </div>

          <div class="icons">
            <a href="suporte.html">
              <i class="fa-regular fa-circle-question"></i>
            </a>
            <a href="notificacoes.html" class="notification">
              <i class="fa-regular fa-bell"></i>
              <span id="badgeNotificacao"></span>
            </a>

            <div class="user-top">
              <div class="foto-wrapper">
                <a href="perfil.html">
                  <img id="fotoUsuarioTop" src="./img/perfil.jpg" />
                </a>

                <span class="online"></span>
              </div>

              <span id="nomeUsuarioTop"></span>
            </div>
          </div>
        </header>

        <section class="perfil-card">
          <img
            id="previewFoto"
            src="./img/perfil.jpg"
            alt="Foto do usuário"
            class="foto-perfil-grande"
          />
          <h2>Meu Perfil</h2>

          <input type="text" id="nomeUsuario" placeholder="Nome" />

          <input type="email" id="emailUsuario" placeholder="E-mail" />

          <label for="novaFoto" class="label-foto"> Foto de Perfil </label>

          <input type="file" id="novaFoto" accept="image/*" />

          <small class="texto-foto">
            Escolha uma imagem para ser sua foto de perfil.
          </small>
          <button id="salvarPerfil">Salvar Alterações</button>
          <div class="logout-container">
            <button id="btnLogout" class="btn-logout">
              <i class="fa-solid fa-right-from-bracket"></i>
              Sair
            </button>
          </div>
        </section>
        <section id="listaNotificacoes"></section>
      </main>
    </div>

    <script src="./js/user.js"></script>
    <script src="./js/perfil.js"></script>
    <script src="./js/global.js"></script>
  </body>
</html>
