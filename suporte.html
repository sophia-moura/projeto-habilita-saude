<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecionando — Habilita Saúde</title>
    <meta name="description" content="Acesse a central de suporte da Habilita Saúde." />
    <script>
      (async function () {
        try {
            const resposta = await fetch("/api/usuario-logado", {
                credentials: "include",
                cache: "no-store"
            });

            if (!resposta.ok) {
                window.location.replace("index.html");
                return;
            }

            const dados = await resposta.json();

            if (!dados.autenticado || !dados.usuario) {
                window.location.replace("index.html");
                return;
            }

            const destino = dados.usuario.tipo === "aluno"
                ? "aluno-suporte.html"
                : "professor-suporte.html";

            window.location.replace(destino);
        } catch (erro) {
            console.error("Erro ao verificar sessão:", erro);
            window.location.replace("index.html");
        }
    })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=professor-suporte.html" /></noscript>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f7f9fa;
        color: #1a202c;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      a { color: #0055c3; }
    </style>
    <link rel="stylesheet" href="./css/assistente.css" />
    <script defer src="./js/assistente.js"></script>
  </head>
  <body>
    <main>
      <h1>Redirecionando…</h1>
      <p>Se nada acontecer, <a href="./professor-suporte.html">continue para o suporte</a>.</p>
    </main>
  </body>
</html>
