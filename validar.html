<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validar Certificado — Habilita Saúde</title>
  <meta
    name="description"
    content="Valide a autenticidade dos certificados emitidos pela Habilita Saúde usando o código de validação."
  />
  <link rel="icon" href="./img/favicon.png" />
  <style>
    *{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0055c3,#0055c3);padding:20px}
    .caixa{background:#fff;border-radius:22px;padding:34px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:e .6s cubic-bezier(.2,1.4,.4,1)}
    @keyframes e{from{opacity:0;transform:translateY(30px) scale(.94)}}
    img{height:60px;display:block;margin:0 auto 18px}
    h1{font-size:20px;color:#0055c3;text-align:center;margin:0 0 6px}
    p.s{text-align:center;color:#718096;margin:0 0 20px;font-size:14px}
    input{width:100%;padding:13px;border:1px solid #ccd5e8;border-radius:12px;font-size:14px;letter-spacing:1px}
    button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#0055c3;color:#fff;font-weight:600;cursor:pointer}
    .res{margin-top:20px;padding:18px;border-radius:14px;font-size:14px;line-height:1.7;animation:e .5s}
    .ok{background:#e8f7ec;color:#17692b}.no{background:#fdecec;color:#a12626}
  </style>
    <link rel="stylesheet" href="./css/dark.css" />

    <script src="./js/global.js"></script>
    <script src="./js/tema.js"></script>
    <link rel="stylesheet" href="./css/assistente.css" />
    <script defer src="./js/assistente.js"></script>
  </head>
<body>
  <main class="caixa">
    <img src="./img/logo.png" alt="Habilita Saúde" />
    <h1>Validação de certificado</h1>
    <p class="s">Informe o código de 32 caracteres presente no certificado.</p>
    <input id="codigo" maxlength="32" placeholder="Código do certificado" autocomplete="off" aria-label="Código do certificado" />
    <button id="btn" type="button">Validar</button>
    <div id="res" role="status" aria-live="polite"></div>
  </main>
  <script>
    const campo = document.getElementById("codigo");
    const res = document.getElementById("res");
    const btn = document.getElementById("btn");

    const esc = (t) =>
      String(t ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);
      
    async function validar() {
      const id = campo.value.trim().toUpperCase();

      if (!id) {
        res.innerHTML = `<div class="res no">Informe o código do certificado.</div>`;
        return;
      }

      res.innerHTML = `<div class="res">Consultando certificado...</div>`;
      btn.disabled = true;

      try {
        const resposta = await fetch(
          `/api/certificados/validar/${encodeURIComponent(id)}`
        );

        const dados = await resposta.json();

        if (!resposta.ok || !dados.valido) {
          res.innerHTML = `
            <div class="res no">
              <b>✖ Certificado inválido ou indisponível</b><br>
              ${esc(dados.mensagem || "Confira o código e tente novamente.")}
            </div>
          `;
          return;
        }

        const c = dados.certificado;

        const data = c.data
          ? new Date(String(c.data).replace(" ", "T")).toLocaleDateString("pt-BR")
          : "Não informada";

        res.innerHTML = `
          <div class="res ok">
            <b>✔ Certificado autêntico</b><br>
            Aluno: ${esc(c.aluno)}<br>
            Curso: ${esc(c.curso)}<br>
            Carga horária: ${esc(c.cargaHoraria)}h<br>
            Emitido em: ${esc(data)}<br>
            Código: ${esc(c.codigo)}
          </div>
        `;

      } catch (erro) {
        console.error("Erro ao validar certificado:", erro);

        res.innerHTML = `
          <div class="res no">
            Não foi possível consultar o certificado. Tente novamente.
          </div>
        `;

      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", validar);

    campo.addEventListener("keydown", (e) => {
      if (e.key === "Enter") validar();
    });

    const q = new URLSearchParams(location.search).get("id")
      || location.pathname.split("/validar/")[1];

    if (q) {
      campo.value = q;
      validar();
    }
  </script>
</body>
</html>
